services:
  postgres:
    image: postgres:16
    container_name: unusual-options-postgres
    environment:
      POSTGRES_DB: unusual_options
      POSTGRES_USER: unusual_user
      POSTGRES_PASSWORD: unusual_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
